<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Looking very cute</title>
<style>
  :root{
    --cream:#fff6f0;
    --blush:#ffe3ec;
    --rose:#ff6f9c;
    --rose-deep:#e0447a;
    --ink:#3a2130;
    --ink-soft:#8a6473;
    --ring:#ff487f;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --cream:#241019;
      --blush:#3a1826;
      --rose:#ff87ad;
      --rose-deep:#ffa9c4;
      --ink:#ffeaf1;
      --ink-soft:#d29bb0;
      --ring:#ff6f9c;
    }
  }
  :root[data-theme="dark"]{
    --cream:#241019;--blush:#3a1826;--rose:#ff87ad;--rose-deep:#ffa9c4;
    --ink:#ffeaf1;--ink-soft:#d29bb0;--ring:#ff6f9c;
  }
  :root[data-theme="light"]{
    --cream:#fff6f0;--blush:#ffe3ec;--rose:#ff6f9c;--rose-deep:#e0447a;
    --ink:#3a2130;--ink-soft:#8a6473;--ring:#ff487f;
  }

  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{min-height:100%;}
  body{
    font-family:"Trebuchet MS","Segoe UI",system-ui,-apple-system,sans-serif;
    background:
      radial-gradient(1200px 600px at 50% -10%, var(--blush), transparent 60%),
      var(--cream);
    color:var(--ink);
    display:flex;align-items:center;justify-content:center;
    padding:32px 20px;overflow-x:hidden;position:relative;
  }

  /* floating hearts / balloons / sparkles layer — drifts IN FRONT of everything */
  .sky{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:5;}
  .float{
    position:absolute;bottom:-60px;
    will-change:transform,opacity;
    animation:drift linear forwards;
    filter:drop-shadow(0 4px 6px rgba(224,68,122,.25));
  }
  @keyframes drift{
    0%{transform:translateY(0) rotate(0deg) scale(var(--s,1));opacity:0;}
    10%{opacity:1;}
    50%{transform:translateY(-52vh) translateX(var(--sway,20px)) rotate(12deg) scale(var(--s,1));}
    90%{opacity:1;}
    100%{transform:translateY(-108vh) translateX(0) rotate(-8deg) scale(var(--s,1));opacity:0;}
  }
  .card{position:relative;z-index:1;opacity:0;}
  body.opened .card{opacity:1;animation:cardIn .55s ease .05s;}
  @keyframes cardIn{from{opacity:0;transform:scale(.94);}to{opacity:1;transform:none;}}

  /* Full-screen intro balloon */
  .stage{
    position:fixed;inset:0;z-index:20;cursor:pointer;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:30px;
    background:
      radial-gradient(900px 700px at 50% 42%, var(--blush), transparent 62%),
      var(--cream);
  }
  .stage.gone{animation:stageOut .45s .35s forwards;pointer-events:none;}
  @keyframes stageOut{to{opacity:0;visibility:hidden;}}

  /* size unit scales with the screen so the heart fills most of it */
  .big-balloon{
    position:relative;font-size:clamp(48px,20vmin,94px);
    width:5em;height:6.4em;
    border:none;background:none;padding:0;cursor:pointer;
    animation:balloonFloat 3.4s ease-in-out infinite;
  }
  .big-balloon:focus-visible{outline:3px solid var(--rose-deep);outline-offset:8px;border-radius:24px;}
  .big-balloon.pop{animation:popAway .4s forwards;}
  @keyframes popAway{0%{transform:scale(1);opacity:1;}45%{transform:scale(1.32);opacity:1;}100%{transform:scale(1.65);opacity:0;}}

  .big-balloon .bheart{
    position:absolute;top:0;left:0;width:5em;height:4.6em;
    filter:drop-shadow(0 .3em .5em rgba(224,68,122,.55));
  }
  .big-balloon .bheart::before,.big-balloon .bheart::after{
    content:"";position:absolute;top:0;width:2.5em;height:4em;
    border-radius:2.5em 2.5em 0 0;
    background:linear-gradient(150deg,#ff9dbd 8%,var(--rose) 45%,var(--rose-deep) 100%);
  }
  .big-balloon .bheart::before{left:2.5em;transform:rotate(-45deg);transform-origin:0 100%;}
  .big-balloon .bheart::after{left:0;transform:rotate(45deg);transform-origin:100% 100%;}
  .big-balloon .bshine{
    position:absolute;top:1em;left:1.1em;width:1em;height:1.3em;z-index:2;
    background:radial-gradient(closest-side, rgba(255,255,255,.85), transparent 75%);
    border-radius:50%;transform:rotate(-20deg);pointer-events:none;
  }
  .big-balloon .blabel{
    position:absolute;top:1.55em;left:0;width:5em;text-align:center;z-index:3;
    color:#fff;font-weight:900;font-size:.56em;line-height:1.08;letter-spacing:.01em;
    text-shadow:0 2px 6px rgba(150,20,60,.55);pointer-events:none;
  }
  .big-balloon .bstring{
    position:absolute;top:4.5em;left:2.47em;width:.06em;height:1.9em;z-index:1;
    background:linear-gradient(var(--rose-deep),transparent);border-radius:3px;pointer-events:none;
  }
  .stage .hint{
    font-size:1.05rem;font-weight:700;color:var(--rose-deep);letter-spacing:.02em;
    animation:hintPulse 1.5s ease-in-out infinite;
  }
  @keyframes hintPulse{0%,100%{opacity:.6;}50%{opacity:1;}}

  .burst{
    position:fixed;top:44%;left:50%;z-index:21;pointer-events:none;
    font-size:clamp(90px,26vw,150px);
    transform:translate(-50%,-50%) scale(0);opacity:0;
  }
  .burst.show{animation:burstFx .5s forwards;}
  @keyframes burstFx{0%{transform:translate(-50%,-50%) scale(.3);opacity:1;}100%{transform:translate(-50%,-50%) scale(1.8);opacity:0;}}

  .card{
    width:min(560px,100%);
    text-align:center;
    display:flex;flex-direction:column;align-items:center;gap:22px;
  }

  .kicker{
    font-size:.78rem;letter-spacing:.34em;text-transform:uppercase;
    color:var(--rose-deep);font-weight:700;
    opacity:0;animation:rise .6s .1s forwards;
  }

  h1{
    font-weight:900;line-height:.92;letter-spacing:-.02em;
    font-size:clamp(3.4rem,14vw,6.2rem);
    text-wrap:balance;
    background:linear-gradient(180deg,var(--rose),var(--rose-deep));
    -webkit-background-clip:text;background-clip:text;color:transparent;
    opacity:0;animation:pop .7s .25s cubic-bezier(.34,1.56,.64,1) forwards;
  }

  /* Heart-shaped balloon button */
  .clickme{
    position:relative;width:172px;height:206px;
    border:none;background:none;padding:0;cursor:pointer;
    animation:balloonFloat 3s ease-in-out infinite;
  }
  .clickme:focus-visible{outline:3px solid var(--rose-deep);outline-offset:6px;border-radius:20px;}
  .clickme:hover{filter:brightness(1.04);}
  .clickme:active{transform:scale(.95);}

  .clickme .heart{
    position:absolute;top:4px;left:6px;width:160px;height:144px;
    filter:drop-shadow(0 12px 20px rgba(224,68,122,.55));
  }
  .clickme .heart::before,.clickme .heart::after{
    content:"";position:absolute;top:0;width:80px;height:128px;
    border-radius:80px 80px 0 0;
    background:linear-gradient(150deg,#ff9dbd 8%,var(--rose) 45%,var(--rose-deep) 100%);
  }
  .clickme .heart::before{left:80px;transform:rotate(-45deg);transform-origin:0 100%;}
  .clickme .heart::after{left:0;transform:rotate(45deg);transform-origin:100% 100%;}
  /* shine highlight */
  .clickme .shine{
    position:absolute;top:34px;left:44px;width:34px;height:44px;z-index:2;
    background:radial-gradient(closest-side, rgba(255,255,255,.85), transparent 75%);
    border-radius:50%;transform:rotate(-20deg);pointer-events:none;
  }
  .clickme .label{
    position:absolute;top:48px;left:0;width:172px;text-align:center;z-index:3;
    color:#fff;font-weight:900;font-size:1.3rem;letter-spacing:.02em;
    text-shadow:0 2px 5px rgba(150,20,60,.55);pointer-events:none;
  }
  .clickme .string{
    position:absolute;top:142px;left:85px;width:2px;height:62px;z-index:1;
    background:linear-gradient(var(--rose-deep),transparent);
    border-radius:2px;pointer-events:none;
  }
  @keyframes balloonFloat{0%,100%{transform:translateY(0) rotate(-1.5deg);}50%{transform:translateY(-14px) rotate(1.5deg);}}

  .punch{
    font-size:clamp(1rem,4.2vw,1.28rem);
    color:var(--ink-soft);font-weight:600;line-height:1.4;
    max-width:34ch;
    display:none;opacity:0;
  }
  .punch b{color:var(--rose-deep);font-weight:800;}
  body.revealed .clickme{display:none;}
  body.revealed .punch{display:block;animation:rise .6s .1s forwards;}

  .frame-wrap{position:relative;display:flex;justify-content:center;}
  .balloon{
    position:absolute;top:6%;font-size:clamp(2rem,9vw,2.8rem);z-index:2;
    opacity:0;filter:drop-shadow(0 6px 8px rgba(224,68,122,.3));
    animation:balloonIn .7s 1.2s cubic-bezier(.34,1.56,.64,1) forwards, bob 3.2s 1.9s ease-in-out infinite;
  }
  .balloon.l{left:-6%;--rot:-10deg;}
  .balloon.r{right:-6%;--rot:10deg;animation-delay:1.35s,2.1s;}

  .frame{
    position:relative;width:min(280px,80%);
    border-radius:26px;overflow:hidden;
    box-shadow:0 22px 50px -18px rgba(224,68,122,.55),
               0 0 0 6px var(--cream), 0 0 0 8px var(--blush);
    opacity:0;transform:rotate(-3deg) scale(.9);
    animation:photoIn .8s .5s cubic-bezier(.34,1.56,.64,1) forwards, floatBob 4s 1.3s ease-in-out infinite;
  }
  .frame img{width:100%;height:auto;display:block;}

  /* soft heart glow pulsing behind the photo */
  .frame-wrap::before{
    content:"";position:absolute;inset:-14px;border-radius:34px;z-index:-1;
    background:radial-gradient(closest-side, rgba(255,111,156,.5), transparent 72%);
    animation:glow 2.6s ease-in-out infinite;
  }

  .smiley{
    font-size:2.4rem;display:inline-block;
    opacity:0;transform:scale(0);
    filter:drop-shadow(0 5px 6px rgba(224,68,122,.3));
  }
  body.revealed .smiley{
    animation:pop .5s .35s cubic-bezier(.34,1.56,.64,1) forwards,
              wiggle 1.8s .85s ease-in-out infinite;
  }

  /* moving arrow pointing at the nose (revealed on click) */
  .arrow{
    position:absolute;top:29%;left:33%;z-index:3;
    font-size:38px;opacity:0;pointer-events:none;
    filter:drop-shadow(0 3px 5px rgba(0,0,0,.4));
  }
  body.revealed .arrow{
    animation:arrowIn .35s .25s forwards, point 1s .6s ease-in-out infinite;
  }
  @keyframes arrowIn{to{opacity:1;}}
  @keyframes point{0%,100%{transform:translateX(0) rotate(4deg);}50%{transform:translateX(18px) rotate(-2deg);}}

  @keyframes rise{from{opacity:0;transform:translateY(14px);}to{opacity:1;transform:none;}}
  @keyframes pop{from{opacity:0;transform:scale(.6);}to{opacity:1;transform:scale(1);}}
  @keyframes photoIn{from{opacity:0;transform:rotate(-3deg) scale(.9);}to{opacity:1;transform:rotate(-3deg) scale(1);}}
  @keyframes balloonIn{from{opacity:0;transform:translateY(20px) rotate(var(--rot));}to{opacity:1;transform:translateY(0) rotate(var(--rot));}}
  @keyframes bob{0%,100%{transform:translateY(0) rotate(var(--rot));}50%{transform:translateY(-12px) rotate(var(--rot));}}
  @keyframes floatBob{0%,100%{transform:rotate(-3deg) translateY(0);}50%{transform:rotate(-3deg) translateY(-9px);}}
  @keyframes glow{0%,100%{opacity:.55;transform:scale(1);}50%{opacity:.9;transform:scale(1.05);}}
  @keyframes wiggle{
    0%,100%{transform:translateY(0) rotate(-12deg) scale(1);}
    25%{transform:translateY(-14px) rotate(10deg) scale(1.12);}
    50%{transform:translateY(0) rotate(-8deg) scale(1);}
    75%{transform:translateY(-8px) rotate(12deg) scale(1.06);}
  }

  @media (prefers-reduced-motion: reduce){
    *{animation:none!important;}
    .sky{display:none;}
    .stage.gone{display:none;}
    .kicker,.balloon{opacity:1;}
    h1{opacity:1;}
    .frame{opacity:1;transform:rotate(-3deg);}
    .frame-wrap::before{opacity:.6;}
    body.revealed .punch,body.revealed .smiley,body.revealed .arrow{opacity:1;}
  }
</style>
</head>
<body>

<div class="sky" id="sky"></div>

<div class="stage" id="stage">
  <button class="big-balloon" id="bigballoon" type="button" aria-label="Pop the heart">
    <span class="bstring"></span>
    <span class="bheart"></span>
    <span class="bshine"></span>
    <span class="blabel">Pop the<br>heart</span>
  </button>
  <p class="hint">Tap the heart 💗</p>
</div>
<span class="burst" id="burst">💥</span>

<div class="card">
  <div class="kicker">Breaking news 📸</div>
  <h1>Looking<br>very cute</h1>
  <div class="frame-wrap">
    <span class="balloon l">🎈</span>
    <span class="balloon r">🎈</span>
    <div class="frame">
      <img src="https://files.catbox.moe/29cehq.jpg" alt="You, looking very cute">
      <span class="arrow">👉</span>
    </div>
  </div>
  <button class="clickme" id="clickme" type="button" aria-label="Click me">
    <span class="string"></span>
    <span class="heart"></span>
    <span class="shine"></span>
    <span class="label">Click Me</span>
  </button>
  <p class="punch">not you &mdash; but your <b>nose pimple</b> is really stealing the show today</p>
  <div class="smiley">😄</div>
</div>

<script>
(function(){
  var big = document.getElementById("bigballoon");
  var stage = document.getElementById("stage");
  var burst = document.getElementById("burst");
  if(big){
    big.addEventListener("click", function(){
      if(big.classList.contains("pop")) return;
      big.classList.add("pop");
      if(burst) burst.classList.add("show");
      setTimeout(function(){
        if(stage) stage.classList.add("gone");
        document.body.classList.add("opened");
      }, 380);
    });
  }
  var btn = document.getElementById("clickme");
  if(btn){ btn.addEventListener("click", function(){ document.body.classList.add("revealed"); }); }
})();
(function(){
  var reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  if(reduce) return;
  var sky = document.getElementById("sky");
  var emojis = ["💕","💖","❤️","🎈","✨","🌟","💞","🥰","😍","😘"];
  function spawn(){
    var el = document.createElement("span");
    el.className = "float";
    el.textContent = emojis[Math.floor(Math.random()*emojis.length)];
    var size = 16 + Math.random()*26;
    el.style.left = Math.random()*100 + "vw";
    el.style.fontSize = size + "px";
    el.style.setProperty("--s", (0.7 + Math.random()*0.9).toFixed(2));
    el.style.setProperty("--sway", (Math.random()*80 - 40).toFixed(0) + "px");
    var dur = 7 + Math.random()*6;
    el.style.animationDuration = dur + "s";
    sky.appendChild(el);
    setTimeout(function(){ el.remove(); }, dur*1000 + 200);
  }
  for(var i=0;i<10;i++){ setTimeout(spawn, i*380); }
  setInterval(spawn, 650);
})();
</script>
</body>
</html>
